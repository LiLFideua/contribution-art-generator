<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Contribution Art Generator</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main>
    <header><div><h1>Contribution Art</h1><p>Draw a 53 by 7 contribution graph and generate empty commit commands.</p></div></header>
    <section class="panel">
      <div class="tools">
        <button id="clear">Clear</button><button id="fill">Fill text</button><button id="copy">Copy script</button>
      </div>
      <div class="grid" id="grid" aria-label="Pixel grid"></div>
    </section>
    <aside class="panel">
      <label>Text stencil<input id="text" value="ART"></label>
      <label>Start Sunday<input id="start" type="date"></label>
      <label>Commit message<input id="message" value="draw contribution art"></label>
      <textarea id="script" spellcheck="false"></textarea>
    </aside>
  </main>
  <script src="assets/app.js" defer></script>
</body>
</html>
